<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>
      Simple System
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/info-sidebar.css">
    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/info.css">
  </head>

  <body>
    <header class="header">
      <div class="logo">
        <a href="index.html">
          <img class="ss-logo" src="images/ss-logo.png" alt="Simple System logo">
          <img class="ss-text" src="images/ss-text.png" alt="Simple System logo text">
        </a>
      </div>

      <nav class="right-section">
        <a class="laptop-button" href="index.html">
            Laptop
        </a>
        <a class="build-button" href="build.html">
          Build
        </a>
      </nav>
    </header>
 
    <div role="tablist" aria-label="select for information" class="info-sidebar">
      <button 
        role="tab"
        aria-expanded="false"
        aria-controls="contentRegion"
        class="info-sidebar-button js-sidebar-button js-cpu"
      >
        <img src="images/icons/cpu-icon.png" alt="processor_icon">
        CPU
      </button>
      <button
        role="tab" 
        aria-expanded="false"
        aria-controls="contentRegion"
        class="info-sidebar-button js-sidebar-button js-gpu"
      >
        <img src="images/icons/graphics-card-ion.png" alt="graphic card icon">
        GPU
      </button>
      <button 
        role="tab"
        aria-expanded="false"
        aria-controls="contentRegion"
        class="info-sidebar-button js-sidebar-button js-display"
      >
        <img src="images/icons/monitor-icon.png" alt="display icon">
        Display
      </button>
      <button 
        role="tab"
        aria-expanded="false"
        aria-controls="contentRegion"
        class="info-sidebar-button js-sidebar-button js-memory-storage"
      >
        <img src="images/icons/memory-slot-icon.png" alt="memory and storage icon">
        Memory &amp; Storage
      </button>
      <button 
        role="tab"
        aria-expanded="false"
        aria-controls="contentRegion"
        class="info-sidebar-button js-sidebar-button js-connectivity"
      >
        <img src="images/icons/connect-icon.png" alt="connectivity icon">
        Connectivity
      </button>
    </div>
  
    <main id="contentRegion" aria-live="assertive" class="js-content">
      <P>
        <b>
          &#8679; Click any tab on the tab bar above for information about each components. 
        </b>

        <br>

        This should give you the basic knowledge about various aspects of the hardware of a computer system, which you might find helpful when purchasing a new pc.
        
      </P>
      
    </main>
    <script src="info-pages/info-cpu.js"></script>
    <script src="info-pages/info-gpu.js"></script>
    <script src="info-pages/info-display.js"></script>
    <script src="info-pages/info-memory-storage.js"></script>
    <script src="info-pages/info-connectivity.js"></script>
    <script src="scripts/info.js"></script>
  </body>
</html>
